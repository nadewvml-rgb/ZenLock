name: Android Build

# Builds a playstore-flavor debug APK and uploads it as a downloadable artifact.
# Runs on every pull request and can be triggered manually from the Actions tab.
#
# iOS, SMS flavor, pr-validation, and release workflows are not used.

on:
  pull_request:
  workflow_dispatch:   # manual run always builds regardless of changed files

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            android:
              - 'ZenLock-Android/**'
              - '.github/workflows/android-build.yml'

  build:
    name: Android Build
    needs: changes
    # Run on manual dispatch (no file filter needed) or when Android files changed in a PR.
    # A skipped job reports success so required checks never hang.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: ZenLock-Android

      - name: Build playstore debug APK
        run: ./gradlew assemblePlaystoreDebug -x lint
        working-directory: ZenLock-Android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenlock-playstore-debug
          # The APK lands here after assemblePlaystoreDebug
          path: ZenLock-Android/app/build/outputs/apk/playstore/debug/app-playstore-debug.apk
          retention-days: 14   # keep for two weeks; adjust as needed
